name: verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: goinmetrics
          POSTGRES_DB: goinmetrics_test
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goinmetrics -d goinmetrics_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://goinmetrics:integration-only@127.0.0.1:5432/goinmetrics_test?sslmode=disable
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: npm run generate --prefix web
      - run: cp -R web/.output/public/. internal/web/public/
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/goinmetrics
